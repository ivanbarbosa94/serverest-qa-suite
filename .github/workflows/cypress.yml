name: Testes automatizados (Cypress)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1-5' # dias úteis, 08h em Brasília

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Executar testes
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          install-command: npm ci 

      - name: Gerar relatório HTML
        if: always()
        run: npm run report

      - name: Publicar relatório e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cypress
          path: |
            cypress/reports/html
            cypress/screenshots
